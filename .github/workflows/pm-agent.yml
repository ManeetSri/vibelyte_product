name: PM Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  pm-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node scripts/pm-agent.js
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
