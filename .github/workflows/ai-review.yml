name: AI Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate diff
        run: git diff origin/main...HEAD > diff.txt

      - name: Run AI Review
        run: node scripts/ai-review.js
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
